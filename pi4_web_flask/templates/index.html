<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Viewer</title>
    <style>
      .image-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .image-item {
        width: 200px;
        text-align: center;
      }
      .label-skipped {
        color: red;
      }
      .label-classified {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>📷 Sports Image Viewer</h1>

    <form method="get" action="/">
      <label>
        <input
          type="checkbox"
          name="classified_only"
          value="1"
          {%
          if
          classified_only
          %}checked{%
          endif
          %}
        />
        Show only classified
      </label>
      <button type="submit">Apply</button>
    </form>

    <div class="image-grid">
      {% for item in images %}
      <div class="image-item">
        <img
          src="{{ url_for('image', filename=item.filename) }}"
          width="200"
        /><br />
        <span
          class="label-{{ 'classified' if item.label != 'skipped' else 'skipped' }}"
          >{{ item.label }}</span
        >
      </div>
      {% endfor %}
    </div>

    <div style="margin-top: 20px">
      {% if page > 1 %}
      <a
        href="{{ url_for('index', page=page-1, classified_only=classified_only|string|lower) }}"
        >« Prev</a
      >
      {% endif %} Page {{ page }} of {{ total_pages }} {% if page < total_pages
      %}
      <a
        href="{{ url_for('index', page=page+1, classified_only=classified_only|string|lower) }}"
        >Next »</a
      >
      {% endif %}
    </div>
  </body>
</html>
